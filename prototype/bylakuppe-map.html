<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTCI Cottages — Bylakuppe map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;font-family:'Public Sans',system-ui,sans-serif;}
  #map{width:100%;height:100%;}
  .leaflet-container{background:#e7e4dc;}
  .pin{background:#7A2E2E;color:#fff;font-weight:700;border-radius:50% 50% 50% 0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.3);border:2px solid #F2C14E;}
  .pin span{transform:rotate(45deg);font-size:13px;font-family:'Noto Serif Tibetan',serif;}
  .pin.temple{background:#2E8B57;}
  .leaflet-popup-content{font-size:13.5px;color:#26221C;margin:10px 12px;}
  .leaflet-popup-content b{font-family:'Hanken Grotesk','Public Sans',sans-serif;}
</style>
</head>
<body>
<div id="map"></div>
<script>
  const cottages = [12.4162, 76.0107];
  const temple   = [12.4197, 75.9569];
  const map = L.map('map', { scrollWheelZoom: false }).setView([12.418, 75.984], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  map.on('click', () => map.scrollWheelZoom.enable());
  const icon = (cls, glyph) => L.divIcon({ className:'', html:`<div class="pin ${cls}"><span>${glyph}</span></div>`, iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-26] });
  L.marker(cottages, { icon: icon('', '༄') }).addTo(map)
    .bindPopup('<b>FTCI Cottages</b><br>Tibetan Settlement, Bylakuppe 571104');
  L.marker(temple, { icon: icon('temple', '༄') }).addTo(map)
    .bindPopup('<b>Golden Temple</b><br>Namdroling Monastery · 2.4 km');
</script>
</body>
</html>
